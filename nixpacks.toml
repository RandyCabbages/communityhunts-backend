[phases.setup]
nixPkgs = [
  "chromium",
  "nss",
  "glib",
  "nspr",
  "atk",
  "at-spi2-atk",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "pango",
  "cairo",
  "cups",
  "expat",
  "alsa-lib",
  "dbus",
  # Xvfb virtual framebuffer — Cloudflare's Managed Challenge on rainbet.com only
  # clears for a HEADED browser (see scripts/check_new_slots.js), so the in-process
  # slot sync must run headed. Railway has no display; lib/rainbetSlotSync.js spawns
  # Xvfb from Node at startup and points DISPLAY at it. This package puts the Xvfb
  # binary on PATH for that spawn.
  "xorg.xvfb"
]

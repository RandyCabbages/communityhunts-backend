name: tests

# main auto-deploys to production on merge, so the suite has to run BEFORE the merge —
# not after. 641 tests existed in this repo with nothing running them; a green PR check is
# the whole point of having written them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall downloads a Chromium for the rainbet scraper. CI never scrapes, and that
      # download is slow and flaky, so skip lifecycle scripts entirely.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
